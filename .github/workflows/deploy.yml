name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject secrets
        env:
          SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:    ${{ secrets.SUPABASE_KEY }}
        run: |
          sed -i "s|SUPABASE_URL_PLACEHOLDER|${SUPABASE_URL}|g"       supabase.js
          sed -i "s|SUPABASE_KEY_PLACEHOLDER|${SUPABASE_KEY}|g"       supabase.js

      - name: Verify injection
        run: |
          FAILED=0

          if grep -q "SUPABASE_URL_PLACEHOLDER" supabase.js; then
            echo "❌ SUPABASE_URL injection FAILED — placeholder still present!"
            FAILED=1
          else
            echo "✅ SUPABASE_URL injected successfully"
          fi

          if grep -q "SUPABASE_KEY_PLACEHOLDER" supabase.js; then
            echo "❌ SUPABASE_KEY injection FAILED — placeholder still present!"
            FAILED=1
          else
            echo "✅ SUPABASE_KEY injected successfully"
          fi

          if [ $FAILED -ne 0 ]; then
            echo "🚫 One or more injections failed — aborting deploy!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
