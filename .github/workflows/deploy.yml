name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Only publish the files the app needs (not worker/, supabase/, notes, etc.).
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css js public _site/

      - name: Inject config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          sed -i "s|SUPABASE_URL_PLACEHOLDER|${SUPABASE_URL}|g" _site/js/config.js
          sed -i "s|SUPABASE_KEY_PLACEHOLDER|${SUPABASE_KEY}|g" _site/js/config.js

      - name: Verify injection
        run: |
          if grep -q "_PLACEHOLDER" _site/js/config.js; then
            echo "❌ Config injection failed — placeholder still present. Check repository secrets."
            exit 1
          fi
          echo "✅ Config injected"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
