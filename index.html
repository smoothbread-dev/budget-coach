<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon"  href="./public/favicon.ico" />
  <link rel="icon" type="image/png"     href="./public/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png"     href="./public/favicon-16x16.png" sizes="16x16" />
  <link rel="apple-touch-icon"          href="./public/apple-touch-icon.png" sizes="180x180" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Coach</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ══════════════════════════════════════════
     AUTH MODAL
══════════════════════════════════════════ -->
<div id="auth-modal">
  <div id="auth-box">
    <h2 id="auth-title">Welcome to Budget Coach</h2>
    <p id="auth-subtitle">Sign in to sync your data across devices</p>

    <input type="email"    id="auth-email"    placeholder="Email address" />
    <div style="position: relative; width: 100%;">
      <input
        type="password"
        id="auth-password"
        placeholder="Password"
        style="width: 100%; padding-right: 45px; box-sizing: border-box;"
      />
      <button type="button" id="toggle-password" style="
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        color: #888;
        padding: 0;
        line-height: 1;
      ">
        <svg id="icon-eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="icon-eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>

    <!-- Forgot Password Link -->
    <div id="forgot-password-wrap" style="
      width: 100%;
      text-align: right;
      margin-top: 4px;
      margin-bottom: 2px;
    ">
      <button id="forgot-password-btn" type="button" style="
        background: none;
        border: none;
        color: #a09dff;
        font-size: 0.82rem;
        cursor: pointer;
        padding: 0;
        text-decoration: underline;
      ">Forgot password?</button>
    </div>

    <button id="auth-submit-btn">Sign In</button>
    <button id="auth-toggle-btn">Don't have an account? Sign Up</button>

    <p id="auth-error" class="bc-hidden" style="color:red"></p>

    <div id="auth-info" class="bc-hidden" style="
      background: rgba(108,99,255,0.1);
      border: 1px solid rgba(108,99,255,0.3);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.85rem;
      color: #c5c3ff;
      line-height: 1.5;
    ">
      <span id="auth-info-text"></span>
      <br /><br />
      <button id="resend-btn" class="bc-hidden" style="
        background: none;
        border: 1px solid rgba(108,99,255,0.4);
        color: #a09dff;
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 0.82rem;
        cursor: pointer;
        transition: all 0.2s;
      ">📧 Resend confirmation email</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     MAIN APP (hidden until logged in)
══════════════════════════════════════════ -->
<div id="app"></div>

<template id="app-template">

  <!-- ══════════════════════════════════════════
       HEADER
  ══════════════════════════════════════════ -->
  <header class="app-header">

    <div class="app-logo">
      <span>🪙</span>
      <span>Budget Coach</span>
    </div>

    <nav class="nav-tabs">
      <button class="nav-tab-btn active" id="tab-btn-planner"   onclick="switchTab('planner')">Plan</button>
      <button class="nav-tab-btn"        id="tab-btn-recurring" onclick="switchTab('recurring')">Recurring</button>
      <button class="nav-tab-btn"        id="tab-btn-savings"   onclick="switchTab('savings')" data-tab="savings">Savings</button>
      <button class="nav-tab-btn"        id="tab-btn-history"   onclick="switchTab('history')">History</button>
      <button class="nav-tab-btn"        id="tab-btn-defaults"  onclick="switchTab('defaults')">Defaults</button>
    </nav>

    <!-- User Avatar Dropdown -->
    <div class="user-menu" id="user-menu">
      <button class="user-avatar-btn" id="user-avatar-btn" aria-label="User menu">
        <span class="user-avatar-circle" id="user-avatar-initial">?</span>
        <span class="user-avatar-chevron">▾</span>
      </button>
      <div class="user-dropdown" id="user-dropdown">
        <div class="user-dropdown-email" id="user-dropdown-email">loading...</div>
        <hr class="user-dropdown-divider" />
        <button class="user-dropdown-signout" id="logout-btn">🚪 Sign Out</button>
      </div>
    </div>

  </header>

  <!-- ══════════════════════════════════════════
       MAIN
  ══════════════════════════════════════════ -->
  <main class="main-content">

    <!-- ════════ PLAN TAB ════════ -->
    <div id="tab-planner">

      <!-- Purpose Banner -->
      <div class="purpose-banner" id="purpose-banner">
        <div class="purpose-icon">📋</div>
        <div class="purpose-text">
          <div class="purpose-title">What is Budget Coach for?</div>
          <div class="purpose-desc">
            This app helps you <strong>plan your spending before your salary arrives</strong>.
            Each month, enter your expected income, then list your expected needs and wants.
            The app projects how much you'll save and lets your AI coach flag any issues —
            <strong>before you spend a single ringgit</strong>.
            Think of it as a monthly rehearsal for your money. 💡
          </div>
        </div>
        <button class="purpose-dismiss" onclick="dismissBanner()" title="Hide for this session">
          Got it ✕
        </button>
      </div>

      <!-- Income & Goal -->
      <div class="card">
        <div class="income-bar">
          <div class="income-info">
            <span class="income-label">Expected Income</span>
            <span class="income-amount" id="income-display">—</span>
          </div>
          <div class="income-actions">
            <div class="goal-badge" id="goal-badge" style="display:none">
              🎯 <span id="goal-badge-text">0% goal</span>
            </div>
            <button class="icon-btn" title="Edit expected income" onclick="openIncomePanel()">✎</button>
            <button class="icon-btn" title="Edit savings goal"    onclick="openGoalPanel()">🎯</button>
          </div>
        </div>
        <div class="goal-bar-wrap" id="goal-bar-wrap" style="display:none">
          <div class="goal-bar-labels">
            <span>Projected Savings</span>
            <span id="goal-bar-pct-label">0% of 0%</span>
          </div>
          <div class="goal-bar-track">
            <div class="goal-bar-fill" id="goal-bar-fill" style="width:0%"></div>
            <div class="goal-marker"   id="goal-marker"   style="left:0%"></div>
          </div>
          <div class="goal-status" id="goal-status-text"></div>
        </div>
      </div>

      <!-- Month Navigator -->
      <div class="card bc-p-month-nav">
        <div class="month-nav">
          <div class="month-nav-center">
            <button class="month-nav-btn" onclick="changeMonth(-1)">‹</button>
            <span class="month-label" id="month-label">—</span>
            <button class="month-nav-btn" onclick="changeMonth(1)">›</button>
          </div>
          <button class="month-delete-btn hidden" id="month-delete-btn"
                  onclick="confirmDeleteMonth()" title="Delete all data for this month">
            🗑️
          </button>
        </div>
      </div>

      <!-- Summary Strip -->
      <div class="summary-strip">
        <div class="summary-tile needs">
          <span class="label">Expected Needs</span>
          <span class="value" id="sum-needs">RM 0</span>
        </div>
        <div class="summary-tile wants">
          <span class="label">Expected Wants</span>
          <span class="value" id="sum-wants">RM 0</span>
        </div>
        <div class="summary-tile savings">
          <span class="label">Projected Savings</span>
          <span class="value" id="sum-savings">RM 0</span>
        </div>
      </div>

      <!-- Total Expenses Bar -->
      <div class="total-expenses-card" id="total-expenses-card" style="display:none">
        <div class="total-expenses-row">
          <span class="total-expenses-label">📊 Total Expected Expenses</span>
          <div class="total-expenses-right">
            <span class="total-expenses-main" id="total-exp-main">RM 0</span>
            <span class="total-expenses-gross" id="total-exp-gross" style="display:none"></span>
            <span class="total-expenses-pct safe" id="total-exp-pct">0%</span>
          </div>
        </div>
        <div class="expenses-bar-track">
          <div class="expenses-bar-fill safe" id="expenses-bar-fill" style="width:0%"></div>
        </div>
        <div class="bc-exp-footer">
          <span class="bc-exp-footer-text" id="total-exp-breakdown"></span>
          <span class="bc-exp-footer-text" id="total-exp-income-label"></span>
        </div>
      </div>

      <!-- NEEDS -->
      <div class="card">
        <div class="section-header">
          <div class="section-title">
            <div class="section-dot need"></div>
            Expected Needs
          </div>
          <span class="section-total" id="needs-total">RM 0</span>
        </div>
        <div class="subsection-label">🔁 Recurring</div>
        <div id="needs-recurring-list"></div>
        <div class="subsection-label bc-mt-12">📌 One-off</div>
        <div id="needs-oneoff-list"></div>
        <button class="add-item-trigger" onclick="toggleAddForm('needs')">+ Add Expected Need</button>
        <div id="add-form-needs" style="display:none">
          <div class="add-form bc-mt-10" id="add-form-needs-inner"></div>
        </div>
      </div>

      <!-- WANTS -->
      <div class="card">
        <div class="section-header">
          <div class="section-title">
            <div class="section-dot want"></div>
            Expected Wants
          </div>
          <span class="section-total" id="wants-total">RM 0</span>
        </div>
        <div class="subsection-label">🔁 Recurring</div>
        <div id="wants-recurring-list"></div>
        <div class="subsection-label bc-mt-12">📌 One-off</div>
        <div id="wants-oneoff-list"></div>
        <button class="add-item-trigger" onclick="toggleAddForm('wants')">+ Add Expected Want</button>
        <div id="add-form-wants" style="display:none">
          <div class="add-form bc-mt-10" id="add-form-wants-inner"></div>
        </div>
      </div>

      <!-- ════════ SAVINGS ALLOCATION (Plan Tab) ════════ -->
      <div class="card" id="plan-savings-card">
        <div class="section-header">
          <div class="section-title">
            <div class="section-dot" style="background:var(--savings)"></div>
            💰 Savings Allocation
          </div>
          <span class="section-total" id="plan-savings-total">RM 0</span>
        </div>

        <p class="bc-tab-description" style="margin-bottom:12px">
          Allocate a portion of your projected savings to your savings goals this month.
          Amounts here are for planning only — they don't affect your projected savings figure.
        </p>

        <!-- Warning banner — shown when over-allocated -->
        <div id="plan-savings-warning" class="plan-savings-warning" style="display:none">
          ⚠️ You've allocated more than your projected savings! Reduce your allocations or trim your expenses.
        </div>

        <!-- Allocation summary row -->
        <div id="plan-savings-summary" class="plan-savings-summary" style="display:none">
          <span id="plan-savings-summary-text"></span>
        </div>

        <!-- List of current allocations -->
        <div id="plan-savings-list"></div>

        <!-- Add allocation trigger -->
        <button class="add-item-trigger" onclick="togglePlanSavingsForm()" id="plan-savings-add-btn">
          + Allocate Savings
        </button>

        <!-- Add allocation form -->
        <div id="plan-savings-form" style="display:none">
          <div class="add-form bc-mt-10">
            <div class="form-row" style="margin-bottom:10px">
              <div class="form-field">
                <label class="form-label">Savings Category</label>
                <select class="form-select" id="plan-savings-category-select" onchange="onPlanSavingsCategoryChange()">
                  <option value="">— Select a category —</option>
                </select>
              </div>
            </div>
            <div class="form-row two">
              <div class="form-field">
                <label class="form-label">Amount (RM)</label>
                <input class="form-input" id="plan-savings-amount" type="number" placeholder="0.00" min="0" step="0.01" />
              </div>
              <div class="form-field">
                <label class="form-label">Monthly Contribution</label>
                <input class="form-input" id="plan-savings-monthly-hint" type="text" disabled placeholder="—" style="color:var(--text-muted)" />
              </div>
            </div>
            <div class="form-actions">
              <button class="btn btn-secondary btn-sm" onclick="togglePlanSavingsForm()">Cancel</button>
              <button class="btn btn-primary btn-sm"   onclick="addPlanSavingsAllocation()">Add</button>
            </div>
          </div>
        </div>
      </div>

      <!-- AI Review -->
      <div id="ai-review-card" class="ai-review-card" style="display:none">
        <div class="card-title">🤖 Coach's Advice</div>
        <div id="ai-review-content"></div>
      </div>

    </div><!-- /tab-planner -->

    <!-- ════════ RECURRING TAB ════════ -->
    <div id="tab-recurring" style="display:none">
      <div class="card">
        <div class="section-header">
          <div class="section-title">🔁 Recurring Items</div>
          <button class="btn btn-primary btn-sm" onclick="openRecurringPanel()">+ Add</button>
        </div>
        <p class="bc-tab-description">
          These are your default recurring expenses. When adding items in the Plan tab, select
          <strong style="color:var(--text)">Recurring</strong> type to pick from this list —
          the amount will auto-fill but you can still edit it. Changing a value here only updates
          the default; it won't affect amounts already in your monthly plans.
        </p>
        <div id="recurring-master-list"></div>
      </div>
    </div>

    <!-- ════════ SAVINGS TAB ════════ -->
    <div id="tab-savings" style="display:none">
      <div class="card">
        <div class="section-header">
          <div class="section-title">💰 Savings Categories</div>
          <button class="btn btn-primary btn-sm" onclick="openAddSavingsCategoryModal()">+ Add Category</button>
        </div>
        <div id="savings-categories-list"></div>
      </div>
    </div>

    <!-- ════════ HISTORY TAB ════════ -->
    <div id="tab-history" style="display:none">
      <div class="card">
        <div class="card-title">📖 Plan History</div>
        <div id="history-grid" class="history-grid"></div>
      </div>
    </div>

    <!-- ════════ DEFAULTS TAB ════════ -->
    <div id="tab-defaults" style="display:none">
      <div class="card">
        <div class="card-title">⚙️ Default Values</div>
        <p class="bc-tab-description">
          These defaults are suggested whenever you open a new month with no data. You can always
          override them per month in the Plan tab.
        </p>
        <div class="defaults-row">
          <div class="defaults-row-info">
            <span class="defaults-row-label">💰 Default Income</span>
            <span class="defaults-row-sub">Starting income suggested for new months</span>
          </div>
          <span class="defaults-row-value" id="defaults-income-display">Not set</span>
          <button class="icon-btn" onclick="openDefaultIncomePanel()">✎</button>
        </div>
        <div class="defaults-row">
          <div class="defaults-row-info">
            <span class="defaults-row-label">🎯 Default Savings Goal</span>
            <span class="defaults-row-sub">Target savings % suggested for new months</span>
          </div>
          <span class="defaults-row-value" id="defaults-goal-display">Not set</span>
          <button class="icon-btn" onclick="openDefaultGoalPanel()">✎</button>
        </div>
      </div>
    </div>

  </main>

  <!-- ══════════════════════════════════════════
       COACH ME BUTTON
  ══════════════════════════════════════════ -->
  <div class="coach-me-wrap" id="coach-me-wrap">
    <button class="coach-me-btn" id="coach-me-btn" onclick="runAIReview()">
      ✨ Coach Me — Analyse My Plan
    </button>
  </div>

  <!-- ══════════════════════════════════════════
       SAVE TOAST
  ══════════════════════════════════════════ -->
  <div class="save-toast" id="save-toast">
    <div class="spinner" id="toast-spinner"></div>
    <span id="toast-label">Saving…</span>
  </div>

  <!-- ══════════════════════════════════════════
       FIRST-TIME SETUP PANEL
  ══════════════════════════════════════════ -->
  <div class="panel-overlay" id="setup-panel-overlay">
    <div class="panel-box">
      <div class="panel-title">👋 Welcome to Budget Coach!</div>
      <div class="panel-subtitle">
        Let's set your default income and savings goal. These will be used as starting values
        whenever you open a new month — you can always change them per month or update them
        in the Defaults tab.
      </div>
      <div class="panel-field">
        <label class="panel-label">Default Monthly Income (RM)</label>
        <div class="currency-wrap">
          <span class="currency-prefix">RM</span>
          <input class="panel-input" id="setup-income" type="number" placeholder="e.g. 5000" />
        </div>
      </div>
      <div class="panel-field">
        <label class="panel-label">Default Savings Goal (%)</label>
        <input class="panel-input" id="setup-goal" type="number" placeholder="e.g. 20" min="0" max="100" />
      </div>
      <div class="panel-actions">
        <button class="btn btn-secondary" onclick="skipSetup()">Skip for now</button>
        <button class="btn btn-primary"   onclick="saveSetup()">Let's go! 🚀</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       USE DEFAULTS PROMPT
  ══════════════════════════════════════════ -->
  <div class="panel-overlay" id="defaults-prompt-overlay">
    <div class="panel-box">
      <div class="panel-title" id="defaults-prompt-title">New Month</div>
      <div class="panel-subtitle" id="defaults-prompt-subtitle"></div>
      <div class="prompt-option" onclick="applyDefaults()">
        <div class="prompt-option-title">✅ Use my defaults</div>
        <div class="prompt-option-sub" id="defaults-prompt-values"></div>
      </div>
      <div class="prompt-option" onclick="enterOwnValues()">
        <div class="prompt-option-title">✏️ Enter my own values for this month</div>
        <div class="prompt-option-sub">I'll type in a different income or savings goal</div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       INCOME PANEL
  ══════════════════════════════════════════ -->
  <div class="panel-overlay" id="income-panel-overlay">
    <div class="panel-box">
      <div class="panel-title">Expected Income 💰</div>
      <div class="panel-subtitle">Enter your expected take-home income for this month.</div>
      <div class="panel-field">
        <label class="panel-label">Income Amount</label>
        <div class="currency-wrap">
          <span class="currency-prefix">RM</span>
          <input class="panel-input" id="panel-income" type="number" placeholder="0.00" />
        </div>
      </div>
      <div class="panel-actions">
        <button class="btn btn-secondary" onclick="cancelIncomePanel()">Cancel</button>
        <button class="btn btn-primary"   onclick="saveIncomePanel()">Save</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       SAVINGS GOAL PANEL
  ══════════════════════════════════════════ -->
  <div class="panel-overlay" id="goal-panel-overlay">
    <div class="panel-box">
      <div class="panel-title" id="goal-panel-title">Savings Goal 🎯</div>
      <div class="panel-subtitle" id="goal-panel-subtitle">What % of income do you want to save this month?</div>
      <div class="panel-field">
        <label class="panel-label">Savings Goal %</label>
        <div class="currency-wrap">
          <span class="currency-prefix">%</span>
          <input class="panel-input" id="panel-goal" type="number" min="1" max="100" placeholder="e.g. 20" />
        </div>
      </div>
      <div class="panel-actions">
        <button class="btn btn-secondary" id="goal-panel-cancel-btn"
                onclick="closePanel('goal-panel-overlay')">Cancel</button>
        <button class="btn btn-primary"   onclick="saveGoalPanel()">Save</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       DEFAULT INCOME PANEL
  ══════════════════════════════════════════ -->
  <div class="panel-overlay" id="default-income-panel-overlay">
    <div class="panel-box">
      <div class="panel-title">Default Income 💰</div>
      <div class="panel-subtitle">Suggested whenever you open a new month with no income set.</div>
      <div class="panel-field">
        <label class="panel-label">Default Income (RM)</label>
        <div class="currency-wrap">
          <span class="currency-prefix">RM</span>
          <input class="panel-input" id="panel-default-income" type="number" placeholder="0.00" />
        </div>
      </div>
      <div class="panel-actions">
        <button class="btn btn-secondary" onclick="closePanel('default-income-panel-overlay')">Cancel</button>
        <button class="btn btn-primary"   onclick="saveDefaultIncomePanel()">Save</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       DEFAULT GOAL PANEL
  ══════════════════════════════════════════ -->
  <div class="panel-overlay" id="default-goal-panel-overlay">
    <div class="panel-box">
      <div class="panel-title">Default Savings Goal 🎯</div>
      <div class="panel-subtitle">Suggested whenever you open a new month with no savings goal set.</div>
      <div class="panel-field">
        <label class="panel-label">Default Savings Goal (%)</label>
        <input class="panel-input" id="panel-default-goal" type="number" placeholder="e.g. 20" min="0" max="100" />
      </div>
      <div class="panel-actions">
        <button class="btn btn-secondary" onclick="closePanel('default-goal-panel-overlay')">Cancel</button>
        <button class="btn btn-primary"   onclick="saveDefaultGoalPanel()">Save</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       RECURRING ITEM PANEL
  ══════════════════════════════════════════ -->
  <div class="panel-overlay" id="recurring-panel-overlay">
    <div class="panel-box">
      <div class="panel-title" id="recurring-panel-title">Add Recurring Item</div>
      <div class="panel-subtitle">This item will appear in the dropdown when adding recurring expenses to any month's plan.</div>
      <div class="panel-field">
        <label class="panel-label">Item Name</label>
        <input class="panel-input" id="panel-rec-name" type="text" placeholder="e.g. Rent" />
      </div>
      <div class="panel-field">
        <label class="panel-label">Default Amount (RM)</label>
        <div class="currency-wrap">
          <span class="currency-prefix">RM</span>
          <input class="panel-input" id="panel-rec-amount" type="number" placeholder="0.00" />
        </div>
      </div>
      <div class="panel-actions">
        <button class="btn btn-secondary" onclick="closePanel('recurring-panel-overlay')">Cancel</button>
        <button class="btn btn-primary"   id="recurring-panel-save-btn" onclick="saveRecurringPanel()">Add</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       EDIT PLAN ITEM PANEL
  ══════════════════════════════════════════ -->
  <div class="panel-overlay" id="edit-item-panel-overlay">
    <div class="panel-box">
      <div class="panel-title">Edit Item ✏️</div>
      <div class="panel-subtitle">Update this item's details.</div>
      <input type="hidden" id="edit-item-id" />
      <div class="panel-field">
        <label class="panel-label">Item Name</label>
        <input class="panel-input" id="edit-item-name" type="text" placeholder="Item name" />
      </div>
      <div class="panel-field">
        <label class="panel-label">Amount (RM)</label>
        <div class="currency-wrap">
          <span class="currency-prefix">RM</span>
          <input class="panel-input" id="edit-item-amount" type="number" placeholder="0.00" />
        </div>
      </div>
      <div class="panel-field">
        <label class="panel-label">Category</label>
        <select class="panel-select" id="edit-item-category" onchange="toggleEditFundedField()">
          <option value="needs">Need</option>
          <option value="wants">Want</option>
        </select>
      </div>
      <div class="panel-field">
        <label class="panel-label">Type</label>
        <select class="panel-select" id="edit-item-type" onchange="toggleEditFundedField()">
          <option value="recurring">Recurring</option>
          <option value="oneoff">One-off</option>
        </select>
      </div>
      <div id="edit-funded-wrap" style="display:none; margin-bottom:14px">
        <label class="funded-check-wrap">
          <input type="checkbox" id="edit-item-funded" />
          <span class="funded-check-label">💰 Funded from saved-up money (won't affect projected savings)</span>
        </label>
      </div>
      <div class="panel-actions">
        <button class="btn btn-secondary" onclick="closePanel('edit-item-panel-overlay')">Cancel</button>
        <button class="btn btn-primary"   onclick="saveEditItem()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       SAVINGS CATEGORY MODAL
  ══════════════════════════════════════════ -->
  <div id="savings-category-modal" class="panel-overlay">
    <div class="panel-box">
      <div class="panel-title" id="savings-category-modal-title">Add Savings Category</div>
      <div class="panel-subtitle">Set a name, monthly contribution and goal amount.</div>

      <input type="hidden" id="savings-category-id">

      <div class="panel-field">
        <label class="panel-label">Category Name</label>
        <input type="text" id="savings-category-name" class="panel-input"
               placeholder="e.g. Emergency Fund, Holiday, New Car">
      </div>

      <div class="panel-field">
        <label class="panel-label">Monthly Contribution (RM)</label>
        <div class="currency-wrap">
          <span class="currency-prefix">RM</span>
          <input type="number" id="savings-category-monthly" class="panel-input"
                 placeholder="e.g. 200" min="0" step="0.01">
        </div>
      </div>

      <div class="panel-field">
        <label class="panel-label">Goal Amount (RM)</label>
        <div class="currency-wrap">
          <span class="currency-prefix">RM</span>
          <input type="number" id="savings-category-goal" class="panel-input"
                 placeholder="e.g. 5000" min="0.01" step="0.01">
        </div>
      </div>

      <div class="panel-actions">
        <button class="btn btn-secondary" onclick="closeSavingsCategoryModal()">Cancel</button>
        <button class="btn btn-primary"   onclick="submitSavingsCategoryModal()">Save</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       SAVINGS ADJUSTMENT MODAL
  ══════════════════════════════════════════ -->
  <div id="savings-adjustment-modal" class="panel-overlay">
    <div class="panel-box">
      <div class="panel-title" id="savings-adjustment-modal-title">Add Adjustment</div>
      <div class="panel-subtitle">
        Record a deposit (+) or withdrawal (−) for this savings category.
      </div>

      <input type="hidden" id="savings-adjustment-category-id">

      <div class="panel-field">
        <label class="panel-label">Amount (RM) — use negative to deduct</label>
        <div class="currency-wrap">
          <span class="currency-prefix">RM</span>
          <input type="number" id="savings-adjustment-amount" class="panel-input"
                 placeholder="e.g. 500 or -200" step="0.01">
        </div>
      </div>

      <div class="panel-field">
        <label class="panel-label">Note (optional)</label>
        <input type="text" id="savings-adjustment-note" class="panel-input"
               placeholder="e.g. Bonus contribution, Emergency withdrawal">
      </div>

      <div class="panel-actions">
        <button class="btn btn-secondary" onclick="closePanel('savings-adjustment-modal')">Cancel</button>
        <button class="btn btn-primary"   onclick="submitSavingsAdjustment()">Save Adjustment</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       HISTORY DETAIL MODAL
  ══════════════════════════════════════════ -->
  <div class="modal-overlay" id="history-modal" onclick="handleModalOverlayClick(event)">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title" id="modal-month-title">—</span>
        <button class="modal-close" onclick="closeHistoryModal()">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       CONFIRMATION MODAL
  ══════════════════════════════════════════ -->
  <div class="panel-overlay" id="confirm-modal-overlay">
    <div class="panel-box">
      <div class="panel-title" id="confirm-modal-title">Are you sure?</div>
      <div class="panel-subtitle" id="confirm-modal-message"></div>
      <div class="panel-actions">
        <button class="btn btn-secondary" id="confirm-modal-cancel">Cancel</button>
        <button class="btn btn-danger"    id="confirm-modal-ok">Delete</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       ALERT MODAL
  ══════════════════════════════════════════ -->
  <div id="alert-modal-overlay" class="panel-overlay">
    <div class="panel-box" onclick="event.stopPropagation()" style="max-width:400px">
      <div class="panel-title" id="alert-modal-title">Warning</div>
      <div class="panel-subtitle" id="alert-modal-message"></div>
      <div class="panel-actions">
        <button class="btn btn-primary" onclick="closeAlert()">OK</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       EDIT PLAN SAVINGS ALLOCATION PANEL
  ══════════════════════════════════════════ -->
  <div class="panel-overlay" id="edit-plan-savings-panel-overlay">
    <div class="panel-box">
      <div class="panel-title">Edit Savings Allocation ✏️</div>
      <div class="panel-subtitle" id="edit-plan-savings-subtitle">
        Update the allocated amount for this category.
      </div>
  
      <input type="hidden" id="edit-plan-savings-id" />
  
      <div class="panel-field">
        <label class="panel-label">Category</label>
        <input class="panel-input" id="edit-plan-savings-cat-name"
               type="text" disabled
               style="color:var(--text-muted); cursor:not-allowed;" />
      </div>
  
      <div class="panel-field">
        <label class="panel-label">Allocated Amount (RM)</label>
        <div class="currency-wrap">
          <span class="currency-prefix">RM</span>
          <input class="panel-input" id="edit-plan-savings-amount"
                 type="number" placeholder="0.00" min="0" step="0.01" />
        </div>
      </div>
  
      <div class="panel-actions">
        <button class="btn btn-secondary"
                onclick="closePanel('edit-plan-savings-panel-overlay')">Cancel</button>
        <button class="btn btn-primary"
                onclick="saveEditPlanSavingsAllocation()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       CHANGE PASSWORD MODAL
  ══════════════════════════════════════════ -->
  <div id="change-password-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>🔐 Change Password</h3>
        <button class="modal-close-btn" onclick="closeChangePasswordModal()">✕</button>
      </div>
      <div class="modal-body">
  
        <div class="form-group">
          <label for="cp-new-password">New Password</label>
          <input type="password" id="cp-new-password" placeholder="Enter new password" />
        </div>
  
        <div class="form-group">
          <label for="cp-confirm-password">Confirm New Password</label>
          <input type="password" id="cp-confirm-password" placeholder="Confirm new password" />
        </div>
  
        <div id="cp-error" class="cp-message cp-error hidden"></div>
        <div id="cp-success" class="cp-message cp-success hidden"></div>
  
        <div class="cp-footer">
          <button class="btn btn-primary" onclick="submitChangePassword()">Update Password</button>
        </div>
  
      </div>
    </div>
  </div>

</template>

<!-- 1. Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Supabase config + auth -->
<script src="supabase.js"></script>

<!-- 3. App logic -->
<script src="app.js"></script>

</body>
</html>
